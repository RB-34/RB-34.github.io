<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recept · My Recipes</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Recept pro tebe">
<meta property="og:description" content="Otevři odkaz a uvidíš celý recept. V appce My Recipes si ho uložíš jedním klepnutím.">
<meta name="apple-itunes-app" content="app-id=6825464934">
<style>
  :root { color-scheme: light dark; --bg: #fbf6ee; --fg: #2b2420; --soft: #7a6c62; --line: #eadfd2; --card: #fff; --accent: #c4552f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1916; --fg: #f3ebe3; --soft: #b4a597; --line: #3d342e; --card: #2a2420; --accent: #ec8a5f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 20px) 18px 24px; }
  .label { text-align: center; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; margin: 0; }
  h1 { text-align: center; font-size: 30px; line-height: 1.15; margin: 6px 0 8px; letter-spacing: -.02em; }
  .lead { color: var(--soft); text-align: center; margin: 0 0 8px; }
  .facts { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; color: var(--soft); margin: 0 0 14px; }
  h2 { font-size: 20px; margin: 22px 0 6px; }
  ul, ol { list-style: none; padding: 0; margin: 0; }
  li { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .qty { font-weight: 600; }
  small { color: var(--soft); }
  .n { display: block; font-size: 13px; color: var(--soft); }
  .box { background: var(--card); border-radius: 16px; padding: 14px 16px; margin: 16px 0; box-shadow: 0 1px 3px #0000001a; }
  .box p { margin: 0 0 10px; }
  .actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  .btn { display: block; text-align: center; border-radius: 14px; padding: 15px; font-weight: 600; text-decoration: none; font-size: 18px; border: 1px solid var(--line); color: var(--fg); background: var(--card); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .error { background: #c0392b; color: #fff; border-radius: 14px; padding: 12px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="label" data-t="label"></p>
  <div id="recipe" hidden>
    <h1 id="title"></h1>
    <p class="lead" id="desc"></p>
    <p class="facts" id="facts"></p>
    <div class="box"><p data-t="why"></p></div>
    <h2 data-t="ingredients"></h2>
    <ul id="ing"></ul>
    <h2 data-t="steps"></h2>
    <ol id="steps"></ol>
    <p id="source"><small></small></p>
  </div>
  <p class="error" id="error" role="alert" hidden></p>
  <div class="actions">
    <a class="btn primary" id="open" data-t="open"></a>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6825464934" data-t="store"></a>
  </div>
</main>
<script>
// Recept je zakódovaný za # (deflate + base64url). Tahle stránka ho jen ukáže,
// nikam nic neposílá. Formát popisuje Mobil_games/recepty/src/share.ts.
(function () {
  var cs = /^(cs|sk)\b/i.test(navigator.language || '');
  var T = cs ? {
    label: 'Recept pro tebe', why: 'V appce My Recipes (Moje recepty) si recept uložíš jedním klepnutím. Appka k němu spočítá makra a alergeny a upozorní, když nesedí na alergie tvé domácnosti.',
    ingredients: 'Suroviny', steps: 'Postup', open: 'Otevřít v appce', store: 'Stáhnout appku zdarma',
    min: '{n} min', serv: 'Porcí: {n}', step: 'Krok {n}', toTaste: 'podle chuti', source: 'Zdroj: {h}',
    broken: 'Odkaz nejde přečíst. Možná se nezkopíroval celý, požádej o nový.',
    old: 'Tenhle prohlížeč recept neumí zobrazit. Otevři ho v appce.',
    units: { pc: 'ks', tbsp: 'lžíce', tsp: 'lžička', clove: 'stroužek', pinch: 'špetka' }
  } : {
    label: 'A recipe for you', why: 'Save it to the My Recipes app with one tap. The app calculates nutrition and allergens and warns you if the recipe isn’t safe for your household’s allergies.',
    ingredients: 'Ingredients', steps: 'Steps', open: 'Open in the app', store: 'Get the free app',
    min: '{n} min', serv: 'Serves {n}', step: 'Step {n}', toTaste: 'to taste', source: 'Source: {h}',
    broken: 'This link can’t be read. It may not have been copied in full – ask for it again.',
    old: 'This browser can’t show the recipe. Open it in the app.',
    units: { pc: 'pcs', tbsp: 'tbsp', tsp: 'tsp', clove: 'clove', pinch: 'pinch' }
  };
  document.documentElement.lang = cs ? 'cs' : 'en';
  var f = function (s, n) { return s.replace(/\{\w\}/, n); };
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.getAttribute('data-t')]; });
  var code = location.hash.slice(1);
  document.getElementById('open').href = 'cz.rb34.recepty://r#' + code;
  if (/android/i.test(navigator.userAgent)) document.getElementById('store').hidden = true; // zatím jen iOS
  var err = function (msg) { var e = document.getElementById('error'); e.textContent = msg; e.hidden = false; };
  var el = function (tag, text, cls) { var x = document.createElement(tag); if (text) x.textContent = text; if (cls) x.className = cls; return x; };
  var num = function (n) { return String(Math.round(n * 100) / 100).replace('.', cs ? ',' : '.'); };
  if (code[0] !== '1') return err(T.broken);
  if (typeof DecompressionStream === 'undefined') return err(T.old);
  try {
    var bin = atob(code.slice(1).replace(/-/g, '+').replace(/_/g, '/'));
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(function (json) {
      var p = JSON.parse(json);
      document.title = p.t + ' · My Recipes';
      document.getElementById('title').textContent = p.t;
      document.getElementById('desc').textContent = p.d || '';
      var facts = document.getElementById('facts');
      facts.append(el('span', f(T.min, p.p + p.c)), el('span', f(T.serv, p.s)));
      var ing = document.getElementById('ing');
      p.i.forEach(function (x) {
        var li = el('li');
        var a = x[1];
        if (a === null) { li.append(x[2] + ' '); li.append(el('small', T.toTaste)); }
        else {
          li.append(el('span', typeof a === 'number' ? num(a) + ' g' : num(a[0]) + ' ' + T.units[a[1]], 'qty'));
          li.append(' ' + x[2]);
        }
        if (x[3]) { li.append(' '); li.append(el('small', '(' + x[3] + ')')); }
        ing.append(li);
      });
      var steps = document.getElementById('steps');
      p.st.forEach(function (s, k) { var li = el('li'); li.append(el('span', f(T.step, k + 1), 'n'), s[0]); steps.append(li); });
      if (p.src) { try { document.querySelector('#source small').textContent = f(T.source, new URL(p.src).hostname.replace(/^www\./, '')); } catch (e) {} }
      document.getElementById('recipe').hidden = false;
    }).catch(function () { err(T.broken); });
  } catch (e) { err(T.broken); }
})();
</script>
</body>
</html>
